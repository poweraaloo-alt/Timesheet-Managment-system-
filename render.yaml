services:
  - type: web
    name: timesheet-management-system
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: gunicorn timesheet_project.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timesheet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.4"

databases:
  - name: timesheet-db
    plan: free
    region: singapore
