{% extends 'base.html' %}

{% block content %}
  <h2>{% if form.instance.pk %}Update{% else %}Create{% endif %} Project</h2>
  <form method="post">
    {% csrf_token %}
    <div>
      <label for="{{ form.name.id_for_label }}">Name:</label>
      {{ form.name }}
    </div>
    <div>
      <label for="{{ form.customer.id_for_label }}">Customer:</label>
      {{ form.customer }}
    </div>
    <div>
      <label for="{{ form.plant_code.id_for_label }}">Plant Code:</label>
      {{ form.plant_code }}
    </div>
    <!-- Add more fields as needed -->
    <button type="submit">Save</button>
  </form>
{% endblock %}
