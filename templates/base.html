<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Timesheet App{% endblock %}</title>
    {% load static %} <!-- Load the static tag library -->
    <style>
        /* Add your custom CSS here */
        .navbar-brand {
            font-weight: bolder; /* Change to your desired font thickness */
            /* You can add more styling properties here, such as font-family, text-decoration, etc. */
        }
    </style>
    <!-- Include Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'style4.css' %}">
    <link rel="stylesheet" href="{% static 'dashboard.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar" style="background-color: rgb(236, 236, 236);padding: 0%;">
        <div id="main">
            <button class="openbtn" onclick="openNav()">&#9776;</button>
        </div>
        <div class="container" style="justify-content: center;">
            <!-- C]entered branding -->
            <div class="navbar-center" style="margin-bottom: 0.5%;">
                <a class="navbar-brand" href="/" style="color: #F30607; font-size: 48px; align-items: center;">autoplant</a>
            </div>
        </div>
        <div class="navbar-right" style="margin-right: 10px;"> <!-- Add this div for the logout button -->
            <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
        </div>
    </nav>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="{% url 'dashboard' %}" id="dashboard-link">Dashboard</a>
        <a href="{% url 'project_list' %}" id="projects-link">Projects</a>
        <a href="{% url 'timesheets' %}" id="timesheets">Timesheets</a>
        <a href="{% url 'approvals' %}" id="approvals-link">Approvals</a>
        <a href="#" id="contact-link">Profile</a>

    </div>

    {% block content %}
    {% endblock %}

    <!-- Include Bootstrap JS and other scripts if needed -->
    <script>
        /* Set the width of the sidebar to 250px and the left margin of the page content to 250px */
        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
            document.getElementById("main").style.marginLeft = "250px";
        }

        /* Set the width of the sidebar to 0 and the left margin of the page content to 0 */
        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
            document.getElementById("main").style.marginLeft = "0";
        }
        // Get the current URL path
    var path = window.location.pathname;

    // Function to highlight the active link
    function highlightActiveLink() {
        var links = document.querySelectorAll('.sidebar a');
        links.forEach(function(link) {
            if (link.getAttribute('href') === path) {
                link.classList.add('active'); // Add a CSS class to highlight the active link
            }
        });
    }

    // Call the function to highlight the active link when the page loads
    highlightActiveLink();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
